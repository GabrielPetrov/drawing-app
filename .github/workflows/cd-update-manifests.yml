name: cd-update-manifests

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

jobs:
  update-manifests:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA tag
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Replace image tags
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA::7}/" k8s/overlays/prod/kustomization.yaml
          # careful: the file has two image sections, so do targeted replacement instead in real repo if needed

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "chore: deploy ${GITHUB_SHA::7}" || echo "No changes"
          git push
