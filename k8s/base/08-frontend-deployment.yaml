apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: drawing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: drawing-app-frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 80
